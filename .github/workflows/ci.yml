name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authoring-skills:
    name: Validate DCP authoring skill suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development-only validation dependencies
        run: python -m pip install -r .agents/skills/dcp-software-assembly-generator/scripts/requirements.txt
      - name: Validate skill metadata, references, schemas and registry
        run: python .agents/skills/dcp-software-assembly-generator/scripts/check_suite.py
      - name: Exercise isolated authoring scenarios
        run: python -m unittest discover -s .agents/skills/dcp-software-assembly-generator/scripts/tests -v

  test:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unfurl-dcp
        uses: actions/checkout@v4

      - name: Verify CI_REPO_TOKEN is configured
        env:
          CI_REPO_TOKEN_PRESENT: ${{ secrets.CI_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${CI_REPO_TOKEN_PRESENT}" != "true" ]]; then
            echo "::error title=Missing CI_REPO_TOKEN::Configure CI_REPO_TOKEN with repo, workflow, read:packages, and write:packages so this repository can read the central Lab Maven packages and dispatch the root package publish workflow."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_GITHUB_USER
          server-password: MAVEN_GITHUB_TOKEN

      - name: Verify unfurl-dcp
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress --update-snapshots verify

      - name: Set up Python for native authoring bundle validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate native authoring resources
        run: |
          python -m pip install -r .agents/skills/dcp-software-assembly-generator/scripts/requirements.txt
          python .agents/skills/dcp-software-assembly-generator/scripts/runtime_bundle.py target/authoring-runtime-bundle --tenant ci-authoring --model-ref ci-unbound-model
      - name: Validate native graphs and connector transport
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress -f tools/skill-runtime-validation/pom.xml verify

  publish:
    name: Request package publish
    runs-on: ubuntu-latest
    needs: [test, authoring-skills]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))

    steps:
      - name: Request Lab changed package publish
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error title=Missing CI_REPO_TOKEN::Configure CI_REPO_TOKEN with repo, workflow, read:packages, and write:packages so this repository can dispatch the Lab package publish workflow."
            exit 1
          fi
          gh workflow run publish-lab-maven.yml \
            --repo UnfurlSystemsLab/unfurl \
            --ref master \
            -f component_ref=master \
            -f skip_tests=true \
            -f maven_threads=1 \
            -f publish_scope=changed \
            -f changed_repository="${{ github.event.repository.name }}"
